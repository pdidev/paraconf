name: "Tests"
on:
  schedule: [ { cron: "48 5 * * 2" } ] # run every Tuesday 5h48
  pull_request:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  reuse:
    name: Reuse compliance check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cmake: [ runner, minimum ] # the CMake of the runner image, or the minimum CMakeLists.txt declares
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install the minimum CMake
        if: matrix.cmake == 'minimum'
        run: |
          version=$(sed -n 's/^cmake_minimum_required(VERSION \([0-9]\+\.[0-9]\+\(\.[0-9]\+\)\?\).*/\1/p' CMakeLists.txt)
          case "$version" in *.*.*) ;; *) version="$version.0" ;; esac
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/Kitware/CMake/releases/download/v$version/cmake-$version-linux-x86_64.tar.gz"
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v$version/cmake-$version-SHA-256.txt" | sha256sum -c --ignore-missing
          tar -xzf "cmake-$version-linux-x86_64.tar.gz"
          echo "$RUNNER_TEMP/cmake-$version-linux-x86_64/bin" >>"$GITHUB_PATH"
      - name: Install a locale with a decimal comma
        # for the tests that check numbers do not depend on the locale, regenerated harmlessly if already there
        run: sudo locale-gen fr_FR.UTF-8
      - name: Build
        env: # run the tests under AddressSanitizer, which also reports leaks
          CFLAGS: -fsanitize=address -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer
          FFLAGS: -fsanitize=address -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address
        run: |
          cmake --version
          cmake -B build -S .
          cmake --build build
          ctest --output-on-failure --test-dir build
